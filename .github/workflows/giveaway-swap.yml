name: Giveaway Daily Swap

# WHY TWO TRIGGER TYPES
# ─────────────────────
# - schedule (cron-job.org external dispatcher via workflow_dispatch) fires daily
#   at 01:55 America/Chicago, DST-adjusted by cron-job.org.
# - workflow_dispatch (manual) lets the operator trigger a run at any time
#   (e.g., to force-test the pipeline after staging values).
#
# The 01:55 gate is enforced by shouldRunGiveawaySwap() in src/schedule.js,
# not by this workflow's cron expression. This workflow is the SOLE executor of
# the daily swap (the monitor.yml fallback was removed 2026-10-13 — see STATE.md).
#
# STAMP PERSISTENCE (git-committed, not Actions-cached)
# ──────────────────────────────────────────────────────
# state/giveaway-swap-date.txt is committed to main so the authoritative stamp
# survives across runs and is read on each checkout. It is kept in git rather
# than the Actions cache because the monitor.yml cache restore proved able to
# clobber git-tracked state (the 2026-10-13 cache-collision incident); the
# git-commit approach is identical to how state/giveaway-snapshot.json is
# already persisted and is unaffected by that cache.

on:
  # Called by cron-job.org daily at 01:55 America/Chicago.
  # The external scheduler must pass trigger: "scheduled" to engage the
  # src/schedule.js gate (same convention as monitor.yml).
  workflow_dispatch:
    inputs:
      trigger:
        description: 'Who is calling (manual = operator, scheduled = cron-job.org)'
        type: choice
        options:
          - manual
          - scheduled
        default: manual

permissions:
  contents: write

jobs:
  swap:
    name: Swap daily giveaway values
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Run the swap ────────────────────────────────────────────────────────
      # --alert-if-empty: send a Telegram warning if nothing is staged (so the
      # operator is reminded they may have forgotten). The flag is opt-in because
      # the gate stays open all day on "nothing staged" — any caller that ran
      # repeatedly would emit a duplicate warning per tick. This once-daily
      # workflow is the only caller, so "at most one warning per day" holds.
      - name: Run giveaway value swap
        env:
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/giveaway/swap.js --alert-if-empty

      # ── Persist the swap stamp ──────────────────────────────────────────────
      # Only commits when the stamp file is new or changed. swap.js only writes
      # it on a successful field promotion (not on "gate-not-open" or
      # "nothing-staged"), so most runs have nothing to commit here.
      #
      # This is now the ONLY workflow that writes the stamp. The rebase+autostash
      # pattern below is retained so this push still converges cleanly with any
      # concurrent monitor.yml changelog commit touching the same branch.
      - name: Commit swap stamp
        if: always()
        run: |
          git config user.name  "mps-store-monitor[bot]"
          git config user.email "mps-store-monitor[bot]@users.noreply.github.com"
          git add state/giveaway-swap-date.txt
          if git diff --cached --quiet; then
            echo "No stamp change to commit."
          else
            # Two -m flags: git joins them with a blank line, giving a proper
            # subject + trailer without an unindented heredoc (which would
            # terminate this YAML block scalar).
            git commit -m "chore(giveaway): persist swap stamp [skip ci]" \
                       -m "Co-Authored-By: Claude <noreply@anthropic.com>"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

name: Store Monitor

on:
  schedule:
    # Run every 15 minutes, offset to minutes 7/22/37/52 to avoid the
    # congested top-of-hour and half-hour marks on GitHub's shared cron
    # scheduler. When any individual tick is dropped the next one fires
    # within 15 minutes, keeping coverage continuous. The status digest is
    # gated to once per clock hour in src/report.js (see HOURLY_STATUS_STAMP_PATH).
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      trigger:
        description: >-
          Who triggered this run. An external scheduler (cron-job.org) must
          pass "scheduled" so the daily/hourly gates apply exactly as they do
          for native cron. A human clicking "Run workflow" leaves this at
          "manual" to get a full report on demand.
        required: false
        default: manual
        type: choice
        options:
          - manual
          - scheduled

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Restore incident state from cache
        uses: actions/cache@v4
        with:
          path: state/
          # Rolling key: each run writes a NEW entry; restore-keys picks the
          # most recent prior entry. Without a unique primary key the save step
          # silently skips ("Cache hit on primary key, not saving") so state
          # accumulates only the very first snapshot and never updates.
          key: incident-state-v1-${{ github.run_id }}
          restore-keys: incident-state-v1-

      - name: Run monitoring tests
        env:
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_TOKEN }}
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
        run: npm test

      - name: Check giveaway freshness
        if: always()
        env:
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_TOKEN }}
        run: node src/giveaway/check.js

      # Self-healing fallback for the dedicated giveaway-swap.yml workflow (which
      # fires once daily via cron-job.org at 02:00 America/Chicago). If that call
      # is ever missed, the next 15-minute monitor tick still finds the gate open
      # (shouldRunGiveawaySwap in src/schedule.js) and swaps.
      #
      # No --alert-if-empty here (unlike giveaway-swap.yml): this step runs every
      # 15 minutes, and "nothing staged" is the normal all-day state once the
      # gate opens — alerting on it here would send ~88 warnings/day. Only the
      # once-daily dedicated workflow sends that reminder.
      - name: Giveaway daily swap (fallback)
        if: always()
        env:
          SHOPIFY_ADMIN_API_TOKEN: ${{ secrets.SHOPIFY_ADMIN_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/giveaway/swap.js

      - name: Process results and send alerts
        if: always()
        env:
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Only set on workflow_dispatch; empty for native schedule runs. The
          # report's resolveIsManualRun() treats "scheduled" (external cron-job.org
          # caller) as a gated run and anything else from a dispatch as manual.
          WORKFLOW_TRIGGER: ${{ github.event.inputs.trigger }}
        run: node src/report.js

      - name: Cache incident state for next run
        if: always()
        uses: actions/cache@v4
        with:
          path: state/
          key: incident-state-v1-${{ github.run_id }}

      - name: Commit giveaway changelog & swap stamp
        if: always()
        run: |
          # The giveaway snapshot, changelog, and swap stamp are persisted in git
          # (not just the run-to-run cache) so the field-change history survives,
          # is reviewable, and both this workflow and giveaway-swap.yml can share
          # one authoritative swap timestamp. Only these three paths are committed;
          # incident state lives in the Actions cache.
          git config user.name "mps-store-monitor[bot]"
          git config user.email "mps-store-monitor@users.noreply.github.com"
          git add state/giveaway-snapshot.json state/giveaway-swap-date.txt CHANGELOG-giveaways.md
          if git diff --cached --quiet; then
            echo "No giveaway changes to commit."
          else
            # Two -m flags: git joins them with a blank line, giving a proper
            # subject + trailer without an unindented heredoc (which would
            # terminate this YAML block scalar).
            git commit -m "chore(giveaway): update changelog [skip ci]" \
                       -m "Co-Authored-By: Claude <noreply@anthropic.com>"
            # Rebase onto any concurrent push so overlapping runs don't fail the push.
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
